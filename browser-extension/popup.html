<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A11y Studio 页面采集</title><link rel="stylesheet" href="popup.css"></head>
<body><main><h1>操作当前页面</h1><p>在当前标签页登录并打开需要检测的页面，然后选择操作方式。</p><button id="live">在 A11y Studio 实时操作</button><p>实时操作会直接作用于当前网站。Chrome 会提示扩展正在调试此标签页。</p><button id="capture">检测并保存采集文件</button><p>优先采集整页画面；超长页面或浏览器限制下会退回当前可见区域。采集文件包含页面内容和截图，可能包含个人信息。请确认有权检测并妥善保管。</p><p id="status" role="status" aria-live="polite"></p><p>采集文件可在 A11y Studio 的「URL → 已登录页面」中导入。</p></main><script src="screenshot.js"></script><script src="popup.js"></script></body></html>
